# Builds the NAR for a version tag (v0.1.0, v0.2.0-rc.1, ...) and attaches it to a GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build NAR and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with contrib-check
        run: ./mvnw -B -ntp verify -P contrib-check

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: nifi-cdc-postgresql-nar/target/*.nar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
